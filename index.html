<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCL 背题本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2E7; --sheet:#F9FBF5; --ink:#1E2B3A; --muted:#5E6B64; --rule:#CFD9C8; --line:#DCE4D5;
  --margin:#C2453B; --accent:#2B5A86; --on-accent:#FFFFFF;
  --r0:#B9C2B4; --r1:#C2453B; --r2:#C98A1E; --r3:#5E9447; --r4:#24654A; --on-r:#FFFFFF;
  --shadow:0 1px 0 rgba(30,43,58,.08), 0 6px 18px -10px rgba(30,43,58,.25);
  color-scheme: light;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131816; --sheet:#1B221F; --ink:#E3E8DF; --muted:#9AA79F; --rule:#2E3833; --line:#28312C;
    --margin:#E06A5E; --accent:#86B5E0; --on-accent:#0F1A24;
    --r0:#3B4540; --r1:#E06A5E; --r2:#E3A845; --r3:#86BD6D; --r4:#4FB386; --on-r:#10140F;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131816; --sheet:#1B221F; --ink:#E3E8DF; --muted:#9AA79F; --rule:#2E3833; --line:#28312C;
  --margin:#E06A5E; --accent:#86B5E0; --on-accent:#0F1A24;
  --r0:#3B4540; --r1:#E06A5E; --r2:#E3A845; --r3:#86BD6D; --r4:#4FB386; --on-r:#10140F;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top, 0px);-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Atkinson Hyperlegible","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:16px; line-height:1.55;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
.top h1{font-size:1.15rem;margin:0;font-weight:700;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .brand{display:flex;align-items:baseline;gap:8px}
.top .brand small{color:var(--muted);font-weight:400;font-size:.85rem}
.iconbtn{border:0;background:transparent;padding:8px 10px;border-radius:10px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;min-height:40px}
.iconbtn:hover{background:var(--line)}
.counter{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* buttons */
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:12px;padding:10px 16px;min-height:44px;font-weight:700}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--margin);border-color:var(--margin);background:transparent}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.notice{margin:14px 0 0;padding:10px 14px;border-radius:12px;border:1px dashed var(--rule);color:var(--muted);font-size:.92rem}
.syncerr{color:var(--margin)}

/* home */
.resume{margin:18px 0 8px;background:var(--sheet);border-radius:18px;box-shadow:var(--shadow);padding:18px 18px 18px 26px;position:relative;overflow:hidden}
.resume::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.8}
.resume .lbl{color:var(--muted);font-size:.9rem}
.resume .t{font-size:1.3rem;font-weight:700;margin:2px 0 4px}
.resume .sub{color:var(--muted);margin-bottom:12px}
.summary{color:var(--muted);margin:18px 0 10px;font-size:.95rem}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.item{background:var(--sheet);border-radius:14px;border:1px solid var(--line);padding:14px 16px;display:grid;gap:8px}
.item button.open{all:unset;cursor:pointer;display:grid;gap:6px}
.item button.open:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.item .name{font-weight:700;font-size:1.05rem}
.item .facts{color:var(--muted);font-size:.9rem;display:flex;gap:14px;flex-wrap:wrap}
.tag{display:inline-block;border:1px solid var(--rule);border-radius:999px;padding:0 8px;font-size:.8rem;color:var(--muted);margin-left:6px;vertical-align:2px;font-weight:400}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--r0)}
.bar span{display:block;height:100%}
.item .tools{display:flex;justify-content:flex-end;gap:6px}
.small{font-size:.85rem;padding:6px 10px;min-height:34px;border-radius:9px}
.empty{text-align:left;background:var(--sheet);border-radius:18px;padding:22px;margin-top:18px;box-shadow:var(--shadow)}
.empty h2{margin:0 0 6px;font-size:1.2rem}
.empty p{color:var(--muted);margin:0 0 14px}

/* import */
.field{display:grid;gap:6px;margin:14px 0}
.field label{font-weight:700}
.field .hint{color:var(--muted);font-size:.9rem}
textarea,input[type=text],select{width:100%;border:1px solid var(--rule);background:var(--sheet);border-radius:12px;padding:12px}
textarea{min-height:240px;resize:vertical;line-height:1.5}
.preview{background:var(--sheet);border-radius:14px;border:1px solid var(--line);padding:14px 16px;margin:14px 0}
.preview ol{margin:8px 0 0;padding-left:1.4em;max-height:260px;overflow:auto}
.preview li{margin:4px 0}
.preview .ref{color:var(--muted)}
.err{color:var(--margin)}

/* study */
.strip{display:flex;gap:4px;flex-wrap:wrap;margin:14px 0 6px}
.dot{width:26px;height:26px;border-radius:7px;border:0;background:var(--r0);color:var(--on-r);font-size:.72rem;font-weight:700;padding:0;font-variant-numeric:tabular-nums}
.dot.l1{background:var(--r1)}.dot.l2{background:var(--r2)}.dot.l3{background:var(--r3)}.dot.l4{background:var(--r4)}
.dot.l0{color:var(--ink)}
.dot.cur{outline:2px solid var(--ink);outline-offset:2px}
.dot.dim{opacity:.25}
.modes{display:flex;gap:6px;margin:8px 0 14px}
.seg{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:6px 14px;min-height:36px;font-size:.9rem}
.seg.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.brief{background:transparent;border:1px dashed var(--rule);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:.95rem}
.brief .row{justify-content:space-between;margin-bottom:4px}
.brief b{font-size:.9rem}

.card{background:var(--sheet);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.src{padding:18px 18px 16px}
.src .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;color:var(--muted);font-size:.9rem}
.dir{font-weight:700;color:var(--ink)}
.play{display:flex;align-items:center;gap:12px}
.playbtn{width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.playbtn svg{width:24px;height:24px}
.playbtn.speaking{background:var(--margin);color:#fff}
.plays{color:var(--muted);font-size:.85rem}
.srctext{margin-top:12px;font-size:1.15rem;line-height:1.6}
.srctext.hidden{all:unset;display:block;margin-top:12px;cursor:pointer;color:var(--muted);border:1px dashed var(--rule);border-radius:10px;padding:10px 12px;font-size:.95rem}
.noaudio{color:var(--muted);font-size:.9rem}

.ans{position:relative;border-top:1px solid var(--line);padding:6px 18px 6px 34px;min-height:calc(2rem * 3 + 12px);
  background-image:repeating-linear-gradient(to bottom, transparent 0, transparent calc(2rem - 1px), var(--line) calc(2rem - 1px), var(--line) 2rem);
  background-position:0 6px;font-size:1.12rem;line-height:2rem}
.ans::before{content:"";position:absolute;left:20px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.75}
.ans .ph{color:var(--muted);font-size:.95rem}
.ans .m{color:var(--muted);letter-spacing:.08em}
.ansbar{display:flex;gap:10px;flex-wrap:wrap;padding:12px 18px 16px}
.ansbar .btn{flex:1;min-width:130px}

.rate{margin:16px 0 0}
.rate .q{color:var(--muted);font-size:.92rem;margin-bottom:8px}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rbtn{border:1px solid var(--rule);background:var(--sheet);border-radius:12px;padding:10px 4px;min-height:58px;display:grid;justify-items:center;gap:4px;font-size:.9rem;font-weight:700}
.rbtn i{width:10px;height:10px;border-radius:50%;display:block}
.rbtn.on{color:var(--on-r);border-color:transparent}
.rbtn.on i{background:var(--on-r)!important}
.rbtn[data-l="1"].on{background:var(--r1)}.rbtn[data-l="2"].on{background:var(--r2)}.rbtn[data-l="3"].on{background:var(--r3)}.rbtn[data-l="4"].on{background:var(--r4)}

.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.foot .wrap{display:flex;gap:10px;padding-top:10px;padding-bottom:10px}
.foot .btn{flex:1}
.spacer{height:96px}
.keys{color:var(--muted);font-size:.8rem;margin-top:14px}
@media (hover:none){.keys{display:none}}

.done{background:var(--sheet);border-radius:20px;box-shadow:var(--shadow);padding:22px;margin-top:18px}
.done h2{margin:0 0 6px;font-size:1.3rem}
.done p{color:var(--muted);margin:0 0 14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;margin:12px 0 18px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.stamp{font-weight:700;color:var(--r4);margin:6px 0 14px}
.history{color:var(--muted);font-size:.9rem;margin-top:16px}

/* settings */
.set{background:var(--sheet);border-radius:16px;border:1px solid var(--line);padding:6px 16px;margin-top:16px}
.set .f{padding:14px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.set .f:last-child{border-bottom:0}
.set .f label{font-weight:700}
.set .f .hint{color:var(--muted);font-size:.88rem}
.check{display:flex;gap:10px;align-items:center;font-weight:700}
.check input{width:20px;height:20px}
input[type=range]{width:100%}
.loading{padding:60px 0;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){
  .card{animation:none}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
const app = document.getElementById('app');
const HAN = /[\u3400-\u9FFF]/;
const LEVELS = [
  {l:1, name:'完全不熟'},
  {l:2, name:'有点印象'},
  {l:3, name:'基本会'},
  {l:4, name:'熟练'}
];

/* ---------- prefs (per device) ---------- */
const PKEY = 'ccl-notebook-prefs';
let prefs = {zhVoice:'', enVoice:'', rate:1, hideSource:false, autoNext:true};
try { Object.assign(prefs, JSON.parse(localStorage.getItem(PKEY) || '{}')); } catch(e){}
function savePrefs(){ try { localStorage.setItem(PKEY, JSON.stringify(prefs)); } catch(e){} }

/* ---------- state ---------- */
const S = {
  mode:'loading', dialogs:{}, meta:{}, view:'home',
  cur:null, idx:0, hint:0, filter:'all', showSrc:!prefs.hideSource, finish:false, plays:0,
  importText:'', parsed:null, parseErr:'', confirmDel:null, notice:'', syncErr:'', slow:false, stamped:false
};

/* ---------- storage ---------- */
let coll = null;
let dlCap = null;
const LKEY = 'ccl-notebook-v1';
const queues = {};
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function localLoad(){ try { const j = JSON.parse(localStorage.getItem(LKEY) || 'null'); if (j){ S.dialogs = j.dialogs || {}; S.meta = j.meta || {}; } } catch(e){} }
function localSave(){ try { localStorage.setItem(LKEY, JSON.stringify({dialogs:S.dialogs, meta:S.meta})); } catch(e){ S.syncErr = '这台设备的浏览器不允许保存数据。'; render(); } }

function persist(key){
  if (S.mode === 'local'){ clearTimeout(queues._local); queues._local = setTimeout(localSave, 300); return; }
  if (S.mode !== 'db') return;
  const q = queues[key] || (queues[key] = {timer:null, busy:false, again:false});
  clearTimeout(q.timer);
  q.timer = setTimeout(() => { q.timer = null; flush(key); }, 500);
}
async function flush(key){
  const q = queues[key];
  if (q.busy){ q.again = true; return; }
  q.busy = true;
  try {
    const ref = coll.doc(key === 'meta' ? 'meta' : 'd-' + key);
    if (key !== 'meta' && !S.dialogs[key]) await ref.delete();
    else await ref.set(clone(key === 'meta' ? S.meta : S.dialogs[key]));
    if (S.syncErr){ S.syncErr = ''; render(); }
  } catch(e){
    if (e && e.code === 'unavailable'){ q.busy = false; setTimeout(() => flush(key), 1500 + Math.random()*1500); return; }
    if (e && e.code === 'quota_exceeded') S.syncErr = '云端空间已满，请删除一些不用的对话。';
    else S.syncErr = '进度没能保存到云端，请检查网络后再试。';
    render();
  }
  q.busy = false;
  if (q.again){ q.again = false; flush(key); }
}
function pending(key){ const q = queues[key]; return q && (q.timer || q.busy); }

function subscribe(){
  const timer = setTimeout(() => { S.slow = true; render(); }, 10000);
  let first = true;
  coll.onSnapshot(snap => {
    const dialogs = {}; let meta = {};
    snap.docs.forEach(d => {
      if (!d.exists) return;
      const v = d.data();
      if (d.id === 'meta') meta = clone(v);
      else if (d.id.indexOf('d-') === 0) dialogs[d.id.slice(2)] = clone(v);
    });
    Object.keys(queues).forEach(k => {
      if (k === '_local' || !pending(k)) return;
      if (k === 'meta') meta = S.meta;
      else if (S.dialogs[k]) dialogs[k] = S.dialogs[k];
      else delete dialogs[k];
    });
    S.dialogs = dialogs; S.meta = meta;
    if (!snap.metadata.fromCache){ clearTimeout(timer); S.slow = false; }
    if (first || S.mode === 'loading'){ first = false; S.mode = 'db'; }
    if (S.cur && !S.dialogs[S.cur]){ S.cur = null; S.view = 'home'; }
    if (S.view !== 'import' && S.view !== 'settings') render();
  }, err => {
    clearTimeout(timer);
    S.syncErr = '云端数据连接中断，刷新页面后重试。';
    render();
  });
}

async function init(){
  render();
  let db = null, user = null, uid = null;
  try {
    if (window.claude && typeof window.claude.use === 'function'){
      [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (db && user) uid = await user.id();
    }
  } catch(e){}
  if (db && uid){
    coll = db.collection('data/users/' + uid);
    S.mode = 'db-loading';
    subscribe();
    window.claude.use('downloads').then(x => { dlCap = x; if (S.view === 'settings') render(); }).catch(() => {});
  } else {
    S.mode = 'local';
    localLoad();
    S.notice = '这是本地版：进度保存在这台电脑的这个浏览器里。记得偶尔在“设置”里导出备份。';
    render();
  }
}

/* ---------- parsing ---------- */
function cleanText(s){ return s.replace(/[\u200B-\u200D\uFEFF]/g,'').replace(/\u00A0/g,' ').replace(/\r/g,''); }
function parseDialog(raw){
  const lines = cleanText(raw).split('\n').map(l => l.trim());
  let title = '', source = '', briefing = '', segs = [], cur = null, inBrief = false;
  for (const l of lines){
    if (!l) continue;
    if (/END OF DIALOG/i.test(l)) break;
    let m;
    if ((m = l.match(/^source\s*[:：]\s*(.*)$/i))){ source = m[1].trim(); continue; }
    if ((m = l.match(/^briefing\s*[:：]\s*(.*)$/i))){ briefing = m[1].trim(); inBrief = true; continue; }
    if ((m = l.match(/^(\d{1,3})\s*[.．、)）]\s*(.*)$/))){
      cur = {text:m[2].trim(), ref:'', open:false};
      segs.push(cur); inBrief = false; continue;
    }
    if (cur){
      if (cur.open){
        const end = /[)）]\s*$/.test(l);
        cur.ref += ' ' + (end ? l.replace(/[)）]\s*$/,'') : l);
        if (end) cur.open = false;
        continue;
      }
      if (/^[（(]/.test(l) && !cur.ref){
        const body = l.replace(/^[（(]/,'');
        if (/[)）]\s*$/.test(body)) cur.ref = body.replace(/[)）]\s*$/,'');
        else { cur.ref = body; cur.open = true; }
        continue;
      }
      if (!cur.ref){ cur.text += (HAN.test(l) ? '' : ' ') + l; continue; }
      continue;
    }
    if (inBrief){ briefing += ' ' + l; continue; }
    if (!title) title = l;
  }
  segs = segs.filter(s => s.text).map(s => ({
    text:s.text.trim(), ref:s.ref.trim(), lang: HAN.test(s.text) ? 'zh' : 'en'
  }));
  let domain = '';
  const dm = title.match(/\s[-–—]\s*([^-–—]+)$/);
  if (dm) domain = dm[1].trim();
  return {title, domain, source, briefing:briefing.trim(), segs};
}

/* ---------- speech ---------- */
const synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;
let voices = [];
function loadVoices(){
  if (!synth) return;
  voices = synth.getVoices() || [];
  if (S.view === 'settings') render();
}
if (synth){
  loadVoices();
  if (synth.addEventListener) synth.addEventListener('voiceschanged', loadVoices);
  else synth.onvoiceschanged = loadVoices;
}
function zhVoices(){ return voices.filter(v => /^zh/i.test(v.lang) || /^cmn/i.test(v.lang)); }
function enVoices(){ return voices.filter(v => /^en/i.test(v.lang)); }
function pickVoice(lang){
  const pref = lang === 'zh' ? prefs.zhVoice : prefs.enVoice;
  let v = voices.find(x => x.voiceURI === pref);
  if (v) return v;
  const nat = x => /natural|online|premium|enhanced/i.test(x.name);
  if (lang === 'zh'){
    const cn = voices.filter(x => /zh[-_]CN|cmn/i.test(x.lang));
    v = cn.find(nat) || cn[0] || zhVoices()[0];
  } else {
    const au = voices.filter(x => /en[-_]AU/i.test(x.lang));
    const other = voices.filter(x => /en[-_](GB|US)/i.test(x.lang));
    v = au.find(nat) || au[0] || other.find(nat) || other[0] || enVoices()[0];
  }
  return v || null;
}
let speaking = false;
function setSpeaking(on){
  speaking = on;
  document.querySelectorAll('[data-speak]').forEach(b => {
    b.classList.toggle('speaking', on && b.dataset.active === '1');
    if (!on) b.dataset.active = '';
    b.setAttribute('aria-label', on && b.classList.contains('speaking') ? '停止播放' : '播放');
    const ic = b.querySelector('.ic');
    if (ic) ic.innerHTML = (on && b.classList.contains('speaking')) ? ICON_STOP : ICON_PLAY;
  });
}
function speak(text, lang, btn){
  if (!synth) return;
  if (speaking && btn && btn.dataset.active === '1'){ synth.cancel(); setSpeaking(false); return; }
  synth.cancel();
  document.querySelectorAll('[data-speak]').forEach(b => b.dataset.active = '');
  if (btn) btn.dataset.active = '1';
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(lang);
  if (v){ u.voice = v; u.lang = v.lang; } else u.lang = lang === 'zh' ? 'zh-CN' : 'en-AU';
  u.rate = Number(prefs.rate) || 1;
  u.onstart = () => setSpeaking(true);
  u.onend = () => setSpeaking(false);
  u.onerror = () => setSpeaking(false);
  synth.speak(u);
}
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
const ICON_STOP = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';

/* ---------- hints ---------- */
const PUNCT = /[\s，。！？、；：“”‘’（）《》〈〉…—·,.!?;:'"()\[\]\-–]/;
function hintPieces(ref, level){
  if (level >= 4) return [{t:ref, h:false}];
  if (!HAN.test(ref)){
    const parts = ref.split(/(\s+)/);
    const n = parts.filter(p => p.trim()).length;
    const reveal = level <= 1 ? 0 : Math.ceil(n * (level === 2 ? 1/3 : 2/3));
    let wi = 0;
    return parts.map(p => {
      if (!p.trim()) return {t:p, h:false};
      const i = wi++;
      if (i < reveal) return {t:p, h:false};
      let seen = false, out = '';
      for (const c of p){
        if (/[A-Za-z0-9]/.test(c)){ out += seen ? '_' : c; seen = true; }
        else out += c;
      }
      return {t:out, h:true};
    });
  }
  const chars = [...ref];
  const slots = []; let start = true;
  chars.forEach((c, i) => {
    if (PUNCT.test(c)){ start = true; return; }
    slots.push({i, first:start}); start = false;
  });
  const reveal = level <= 1 ? 0 : Math.ceil(slots.length * (level === 2 ? 1/3 : 2/3));
  const shown = new Set();
  slots.forEach((s, k) => { if (k < reveal || s.first) shown.add(s.i); });
  return chars.map((c, i) => (PUNCT.test(c) || shown.has(i)) ? {t:c, h:false} : {t:'＿', h:true});
}

/* ---------- helpers ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid8(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtDate(iso){
  if (!iso) return '';
  const d = new Date(iso); if (isNaN(d)) return '';
  const now = new Date();
  const days = Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate()) - new Date(d.getFullYear(),d.getMonth(),d.getDate())) / 86400000);
  if (days === 0) return '今天';
  if (days === 1) return '昨天';
  if (days < 7) return days + ' 天前';
  return (d.getMonth()+1) + ' 月 ' + d.getDate() + ' 日';
}
function ratingCounts(d){
  const c = [0,0,0,0,0];
  d.segs.forEach((s, i) => { c[(d.ratings && d.ratings[i]) || 0]++; });
  return c;
}
function barHTML(d){
  const c = ratingCounts(d), n = d.segs.length || 1;
  return '<div class="bar" aria-hidden="true">' + [4,3,2,1].map(l => c[l] ? `<span style="width:${c[l]/n*100}%;background:var(--r${l})"></span>` : '').join('') + '</div>';
}
function curDialog(){ return S.cur ? S.dialogs[S.cur] : null; }
function weakList(d){ return d.segs.map((s,i) => i).filter(i => ((d.ratings && d.ratings[i]) || 0) <= 2); }
function navList(d){ return S.filter === 'weak' ? weakList(d) : d.segs.map((s,i) => i); }
function sortedDialogs(){
  return Object.entries(S.dialogs).map(([id,d]) => Object.assign({id}, d))
    .sort((a,b) => String(b.updated||b.created||'').localeCompare(String(a.updated||a.created||'')));
}
function touch(d){ d.updated = new Date().toISOString(); }

/* ---------- actions ---------- */
function openDialog(id, opts){
  const d = S.dialogs[id]; if (!d) return;
  S.cur = id; S.view = 'study'; S.finish = false; S.stamped = false;
  S.filter = (opts && opts.filter) || 'all';
  if (opts && opts.fromStart) S.idx = S.filter === 'weak' ? (weakList(d)[0] ?? 0) : 0;
  else S.idx = Math.min(d.pos || 0, d.segs.length - 1);
  if (S.filter === 'weak'){ const wl = weakList(d); if (wl.length && wl.indexOf(S.idx) < 0) S.idx = wl.find(i => i >= S.idx) ?? wl[0]; }
  resetSeg();
  S.meta.lastId = id; persist('meta');
  render(); window.scrollTo(0,0);
}
function resetSeg(){ S.hint = 0; S.showSrc = !prefs.hideSource; S.plays = 0; if (synth){ synth.cancel(); } speaking = false; }
function goTo(i){
  const d = curDialog(); if (!d) return;
  S.idx = Math.max(0, Math.min(i, d.segs.length - 1)); S.finish = false;
  resetSeg();
  if (S.filter === 'all'){ d.pos = S.idx; touch(d); persist(S.cur); }
  render(); window.scrollTo(0,0);
}
function step(dir){
  const d = curDialog(); if (!d) return;
  if (S.finish){ if (dir < 0){ S.finish = false; render(); } return; }
  const list = navList(d);
  let k = list.indexOf(S.idx);
  if (k < 0) k = dir > 0 ? -1 : list.length;
  const nk = k + dir;
  if (nk >= list.length){
    S.finish = true; S.stamped = false; resetSeg();
    if (S.filter === 'all'){ d.pos = 0; touch(d); persist(S.cur); }
    render(); window.scrollTo(0,0); return;
  }
  if (nk < 0) return;
  goTo(list[nk]);
}
function rate(l){
  const d = curDialog(); if (!d) return;
  d.ratings = d.ratings || {};
  d.ratings[S.idx] = l; touch(d); persist(S.cur);
  if (prefs.autoNext){ render(); setTimeout(() => step(1), 280); }
  else render();
}
function stampDone(){
  const d = curDialog(); if (!d) return;
  d.completions = d.completions || [];
  d.completions.push(new Date().toISOString());
  touch(d); persist(S.cur); S.stamped = true; render();
}
function undoStamp(){
  const d = curDialog(); if (!d || !d.completions || !d.completions.length) return;
  d.completions.pop(); touch(d); persist(S.cur); S.stamped = false; render();
}
function saveImport(asNew){
  const p = S.parsed; if (!p || !p.segs.length) return;
  const title = (document.getElementById('imp-title') || {}).value || p.title || '未命名对话';
  const existing = !asNew && findExisting(p);
  if (existing){
    const d = S.dialogs[existing];
    const keep = d.segs.length === p.segs.length;
    Object.assign(d, {title, domain:p.domain, source:p.source, briefing:p.briefing, segs:p.segs});
    if (!keep){ d.ratings = {}; d.pos = 0; }
    touch(d); persist(existing);
    S.importText = ''; S.parsed = null; openDialog(existing);
    return;
  }
  const id = uid8();
  const now = new Date().toISOString();
  S.dialogs[id] = {title, domain:p.domain, source:p.source, briefing:p.briefing, segs:p.segs, ratings:{}, pos:0, completions:[], created:now, updated:now};
  persist(id);
  S.importText = ''; S.parsed = null;
  openDialog(id);
}
function findExisting(p){
  for (const [id,d] of Object.entries(S.dialogs)){
    if (p.source && d.source === p.source) return id;
    if (!p.source && p.title && d.title === p.title) return id;
  }
  return null;
}
function deleteDialog(id){
  delete S.dialogs[id];
  if (S.meta.lastId === id){ S.meta.lastId = ''; persist('meta'); }
  persist(id); S.confirmDel = null; render();
}

/* ---------- backup ---------- */
function backupName(){
  const d = new Date();
  return 'ccl-backup-' + d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + '.json';
}
async function exportBackup(){
  const data = JSON.stringify({app:'ccl-notebook', version:1, exported:new Date().toISOString(), dialogs:S.dialogs, meta:S.meta}, null, 1);
  if (S.mode === 'db'){
    if (!dlCap){ S.backupMsg = '这里暂时不能下载文件。'; render(); return; }
    try { await dlCap.save({filename:backupName(), data}); S.backupMsg = '备份已导出。'; }
    catch(e){ S.backupMsg = e && e.code === 'declined' ? '' : '导出没有成功，请再试一次。'; }
    render(); return;
  }
  try {
    const url = URL.createObjectURL(new Blob([data], {type:'application/json'}));
    const a = document.createElement('a');
    a.href = url; a.download = backupName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    S.backupMsg = '备份已导出，一般在“下载”文件夹里。';
  } catch(e){ S.backupMsg = '导出没有成功，请再试一次。'; }
  render();
}
function importBackup(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      if (!j || typeof j.dialogs !== 'object') throw new Error('bad');
      let n = 0;
      for (const [id, d] of Object.entries(j.dialogs)){
        if (!d || !Array.isArray(d.segs)) continue;
        S.dialogs[id] = d; persist(id); n++;
      }
      if (j.meta && j.meta.lastId && S.dialogs[j.meta.lastId]){ S.meta.lastId = j.meta.lastId; persist('meta'); }
      S.backupMsg = '已导入 ' + n + ' 篇对话和它们的进度。';
    } catch(e){ S.backupMsg = '这个文件不是背题本的备份。'; }
    render();
  };
  r.onerror = () => { S.backupMsg = '读取文件失败。'; render(); };
  r.readAsText(file);
}

function topBar(left, title, right){
  return `<header class="top"><div class="wrap">${left || ''}<h1>${title}</h1>${right || ''}</div></header>`;
}
function noticeHTML(){
  let h = '';
  if (S.notice) h += `<p class="notice">${esc(S.notice)}</p>`;
  if (S.slow) h += `<p class="notice">暂时连不上云端，显示的进度可能不是最新的。</p>`;
  if (S.syncErr) h += `<p class="notice syncerr">${esc(S.syncErr)}</p>`;
  return h;
}

function viewLoading(){
  return topBar('', '<span class="brand">CCL 背题本</span>') +
    `<main class="wrap"><p class="loading">正在读取你的题库…${S.slow ? '<br>网络有点慢，再等一下。' : ''}</p></main>`;
}

function viewHome(){
  const list = sortedDialogs();
  const last = S.meta.lastId && S.dialogs[S.meta.lastId] ? Object.assign({id:S.meta.lastId}, S.dialogs[S.meta.lastId]) : null;
  const totalDone = list.reduce((a,d) => a + ((d.completions||[]).length), 0);
  let h = topBar('', '<span class="brand">CCL 背题本</span>',
    `<button class="iconbtn" data-act="settings" aria-label="设置">设置</button>`);
  h += '<main class="wrap">' + noticeHTML();
  if (!list.length){
    h += `<section class="empty"><h2>先导入第一篇对话</h2>
      <p>从 CCL小猫复制整篇对话（标题、Briefing、每段原文和括号里的译文），粘贴进来就能开始练。</p>
      <button class="btn primary" data-act="import">导入对话</button></section>`;
    return h + '</main>';
  }
  if (last){
    const n = last.segs.length, p = Math.min((last.pos||0)+1, n);
    h += `<section class="resume"><div class="lbl">上次学到</div>
      <div class="t">${esc(last.title)}</div>
      <div class="sub">第 ${p} / ${n} 段</div>
      <button class="btn primary" data-act="open" data-id="${esc(last.id)}">继续</button></section>`;
  }
  h += `<div class="row" style="justify-content:space-between;margin-top:18px">
      <span class="summary" style="margin:0">共 ${list.length} 篇，累计学完 ${totalDone} 遍</span>
      <button class="btn" data-act="import">导入对话</button></div>`;
  h += '<ul class="list" style="margin-top:12px">';
  for (const d of list){
    const c = ratingCounts(d);
    const done = (d.completions||[]).length;
    h += `<li class="item">
      <button class="open" data-act="open" data-id="${esc(d.id)}">
        <span class="name">${esc(d.title)}${d.domain ? `<span class="tag">${esc(d.domain)}</span>` : ''}</span>
        <span class="facts"><span>学完 ${done} 遍</span><span>${d.segs.length} 段</span><span>熟练 ${c[4]}，不熟 ${c[1]+c[2]}</span>${d.updated ? `<span>${fmtDate(d.updated)}学过</span>` : ''}</span>
        ${barHTML(d)}
      </button>
      <div class="tools">${S.confirmDel === d.id
        ? `<span class="counter" style="align-self:center">删除后进度也会清空</span><button class="btn small ghost" data-act="cancel-del">取消</button><button class="btn small danger" data-act="del" data-id="${esc(d.id)}">确认删除</button>`
        : `<button class="btn small ghost" data-act="ask-del" data-id="${esc(d.id)}">删除</button>`}</div>
    </li>`;
  }
  return h + '</ul><div style="height:40px"></div></main>';
}

  let h = topBar(`<button class="iconbtn" data-act="home" aria-label="返回题库">← 题库</button>`, '导入对话');

    <div class="field"><label for="imp-text">粘贴整篇对话</label>
    <span class="hint">直接从 CCL小猫复制，标题、Source、Briefing、编号段落和括号译文都会自动识别。</span>
    <textarea id="imp-text" placeholder="Build a House - Housing&#10;Source: …&#10;Briefing: …&#10;1. 你好，感谢您百忙之中抽空见我。&#10;(Hello! Thank you for taking time…)">${esc(S.importText)}</textarea></div>
    <button class="btn" data-act="parse">识别内容</button>`;
  if (S.parseErr) h += `<p class="err">${esc(S.parseErr)}</p>`;
  if (p && p.segs.length){
    const missing = p.segs.filter(s => !s.ref).length;
    const ex = findExisting(p);
    h += `<section class="preview">
      <div class="field" style="margin-top:0"><label for="imp-title">标题</label><input type="text" id="imp-title" value="${esc(p.title)}"></div>
      <div>识别到 <b>${p.segs.length}</b> 段${p.briefing ? '，含 Briefing' : ''}${missing ? `，<span class="err">${missing} 段没有找到译文</span>` : ''}</div>
      <ol>${p.segs.map(s => `<li>${esc(s.text)}<br><span class="ref">${esc(s.ref) || '（无译文）'}</span></li>`).join('')}</ol>
    </section>
    <div class="row">${ex

      : `<button class="btn primary" data-act="save-import">保存并开始练习</button>`}</div>
    ${ex ? `<p class="counter" style="margin-top:8px;white-space:normal">题库里已经有这篇。更新时如果段数不变，熟悉度和进度都会保留。</p>` : ''}`;
  }
  return h + '<div style="height:40px"></div></main>';
}

function viewStudy(){
  const d = curDialog();
  if (!d) return viewHome();
  const n = d.segs.length;
  const list = navList(d);
  const weakN = weakList(d).length;
  let h = topBar(`<button class="iconbtn" data-act="home" aria-label="返回题库">← 题库</button>`, esc(d.title),
    `<span class="counter">${S.finish ? '完成' : (S.idx+1) + ' / ' + n}</span>`);
  h += '<main class="wrap">' + (S.syncErr ? `<p class="notice syncerr">${esc(S.syncErr)}</p>` : '');
  h += '<div class="strip" role="navigation" aria-label="段落">' + d.segs.map((s,i) => {
    const l = (d.ratings && d.ratings[i]) || 0;
    const dim = S.filter === 'weak' && list.indexOf(i) < 0;
    return `<button class="dot l${l}${i === S.idx && !S.finish ? ' cur' : ''}${dim ? ' dim' : ''}" data-act="jump" data-i="${i}" aria-label="第 ${i+1} 段">${i+1}</button>`;
  }).join('') + '</div>';
  h += `<div class="modes" role="group" aria-label="练习范围">
    <button class="seg${S.filter==='all'?' on':''}" data-act="filter" data-f="all">全部 ${n} 段</button>
    <button class="seg${S.filter==='weak'?' on':''}" data-act="filter" data-f="weak">只练不熟 ${weakN} 段</button></div>`;

  if (S.finish) return h + finishHTML(d) + '</main>';
  if (S.filter === 'weak' && !weakN){
    return h + `<section class="done"><h2>没有不熟的段落了</h2><p>这篇的每一段都标成了“基本会”或“熟练”。</p>
      <button class="btn primary" data-act="filter" data-f="all">练全部段落</button></section></main>`;
  }

  const s = d.segs[S.idx];
  if (d.briefing && S.idx === (list[0] ?? 0)){
    h += `<section class="brief"><div class="row"><b>Briefing</b>${synth ? `<button class="btn small" data-act="play-brief" data-speak>播放</button>` : ''}</div><span lang="en">${esc(d.briefing)}</span></section>`;
  }
  const dir = s.lang === 'zh' ? '中译英' : '英译中';
  h += `<article class="card"><div class="src">
      <div class="meta"><span>第 ${S.idx+1} 段</span><span class="dir">${dir}</span></div>
      <div class="play">${synth
        ? `<button class="playbtn" id="playbtn" data-act="play" data-speak aria-label="播放"><span class="ic">${ICON_PLAY}</span></button><span class="plays">${S.plays ? `已播放 ${S.plays} 次` : '点击播放原文'}</span>`
        : `<span class="noaudio">这个浏览器不支持朗读，换成 Edge、Chrome 或 Safari 试试。</span>`}</div>
      ${S.showSrc
        ? `<div class="srctext" lang="${s.lang === 'zh' ? 'zh-CN' : 'en'}">${esc(s.text)}</div>`
        : `<button class="srctext hidden" data-act="show-src">原文已隐藏，先听。点这里显示</button>`}
    </div>
    <div class="ans" aria-live="polite" lang="${s.lang === 'zh' ? 'en' : 'zh-CN'}">${answerHTML(s)}</div>
    <div class="ansbar">${S.hint < 4
      ? `<button class="btn" data-act="hint">${S.hint === 0 ? '给点提示' : S.hint < 3 ? '再多一点' : '看完整答案'}<span class="counter" style="margin-left:6px;font-weight:400">${S.hint}/4</span></button>
         <button class="btn ghost" data-act="reveal">直接看答案</button>`
      : `<button class="btn ghost" data-act="hide-ans">遮住答案再试一次</button>`}</div>
  </article>`;
  const cur = (d.ratings && d.ratings[S.idx]) || 0;
  h += `<section class="rate"><div class="q">这一段你现在的熟悉度？${prefs.autoNext ? '选完自动进入下一段。' : ''}</div>
    <div class="rgrid">${LEVELS.map(x => `<button class="rbtn${cur===x.l?' on':''}" data-act="rate" data-l="${x.l}" aria-pressed="${cur===x.l}"><i style="background:var(--r${x.l})"></i>${x.name}</button>`).join('')}</div></section>
    <p class="keys">键盘：空格 播放，H 提示，A 看答案，1–4 评分，← → 切换段落</p>
    <div class="spacer"></div></main>`;
  const k = list.indexOf(S.idx);
  h += `<nav class="foot"><div class="wrap">
    <button class="btn" data-act="prev" ${k <= 0 ? 'disabled' : ''}>上一段</button>
    <button class="btn primary" data-act="next">${k >= list.length - 1 ? '完成' : '下一段'}</button></div></nav>`;
  return h;
}
function answerHTML(s){
  if (!s.ref) return '<span class="ph">这一段没有导入译文。</span>';
  if (S.hint === 0) return '<span class="ph">先自己翻一遍，想不起来再点提示。</span>';
  return hintPieces(s.ref, S.hint).map(p => p.h ? `<span class="m">${esc(p.t)}</span>` : esc(p.t)).join('');
}
function finishHTML(d){
  const c = ratingCounts(d);
  const done = (d.completions||[]).length;
  const weakN = c[0] + c[1] + c[2];
  let h = `<section class="done"><h2>${S.filter === 'weak' ? '不熟的段落过完了' : '这一篇过完了'}</h2>
    <div class="legend">${[4,3,2,1].map(l => `<span><i style="background:var(--r${l})"></i>${LEVELS[l-1].name} ${c[l]}</span>`).join('')}${c[0] ? `<span><i style="background:var(--r0)"></i>未评 ${c[0]}</span>` : ''}</div>`;
  if (S.stamped){
    h += `<div class="stamp">已记录：这是第 ${done} 遍</div>
      <div class="row"><button class="btn primary" data-act="home">回题库</button>
      ${weakN ? `<button class="btn" data-act="restart-weak">只练不熟的 ${weakN} 段</button>` : ''}
      <button class="btn ghost" data-act="undo-stamp">撤销这次记录</button></div>`;
  } else {
    h += `<p>学完了一整遍就点下面的按钮记一次，题库里会显示每篇学了几遍。</p>
      <div class="row"><button class="btn primary" data-act="stamp">本篇学完一遍</button>
      <button class="btn" data-act="restart">从头再来</button>
      ${weakN ? `<button class="btn" data-act="restart-weak">只练不熟的 ${weakN} 段</button>` : ''}</div>`;
  }
  if (done){
    h += `<div class="history">学完记录：${(d.completions||[]).slice(-8).map(fmtDate).join('，')}${done > 8 ? ' 等' : ''}</div>`;
  }
  return h + '</section>';
}

  } else {
    h += `<div class="f"><label for="v-zh">中文声音</label>
        ${zh.length ? `<select id="v-zh" data-pref="zhVoice">${opt(zh, zhSel)}</select>` : '<span class="hint">这台设备上没有找到中文声音。</span>'}
        <button class="btn small" data-act="test-zh" data-speak style="justify-self:start">试听</button></div>
      <div class="f"><label for="v-en">英文声音</label>
        ${en.length ? `<select id="v-en" data-pref="enVoice">${opt(en, enSel)}</select>` : '<span class="hint">这台设备上没有找到英文声音。</span>'}
        <span class="hint">考试用的是澳洲口音，有 English (Australia) 的声音就优先选它。</span>
        <button class="btn small" data-act="test-en" data-speak style="justify-self:start">试听</button></div>
      <div class="f"><label for="v-rate">语速：<span id="rate-val">${Number(prefs.rate).toFixed(1)}</span></label>
        <input type="range" id="v-rate" min="0.6" max="1.4" step="0.1" value="${esc(prefs.rate)}" data-pref="rate"></div>`;
  }
  h += `<div class="f"><label class="check"><input type="checkbox" data-pref="hideSource"${prefs.hideSource ? ' checked' : ''}>默认隐藏原文，先听再看</label></div>
    <div class="f"><label class="check"><input type="checkbox" data-pref="autoNext"${prefs.autoNext ? ' checked' : ''}>评完熟悉度自动进入下一段</label></div>
    <div class="f"><label>进度保存</label><span class="hint">${S.mode === 'local'
      ? '目前只保存在这台设备的浏览器里。'
      : '保存在你的 Claude 账号里，手机和电脑打开同一个页面就能同步。'} 声音和语速是每台设备单独设置的。</span></div>
    <div class="f"><label>备份</label>
      <span class="hint">导出的备份文件包含所有对话、熟悉度和学完次数，可以在另一个版本里导入。同一篇对话会被备份里的版本覆盖。</span>
      <div class="row">${(S.mode === 'local' || dlCap) ? '<button class="btn small" data-act="export">导出备份</button>' : ''}
        <label class="btn small" style="display:inline-flex;align-items:center">导入备份<input type="file" id="backup-file" accept=".json,application/json" hidden></label></div>
      ${S.backupMsg ? `<span class="hint">${esc(S.backupMsg)}</span>` : ''}</div>
  </section><div style="height:40px"></div></main>`;
  return h;
}

/* ---------- render ---------- */
function render(){
  let html;
  if (S.mode === 'loading' || S.mode === 'db-loading') html = viewLoading();
  else if (S.view === 'import') html = viewImport();
  else if (S.view === 'study') html = viewStudy();
  else if (S.view === 'settings') html = viewSettings();
  else html = viewHome();
  app.innerHTML = html;
}

/* ---------- events ---------- */
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  const d = curDialog();
  switch (act){
    case 'home': S.view = 'home'; S.confirmDel = null; if (synth) synth.cancel(); render(); window.scrollTo(0,0); break;
    case 'settings': S.view = 'settings'; S.backupMsg = ''; render(); break;
    case 'import': S.view = 'import'; S.parseErr = ''; render(); break;
    case 'open': openDialog(b.dataset.id); break;
    case 'ask-del': S.confirmDel = b.dataset.id; render(); break;
    case 'cancel-del': S.confirmDel = null; render(); break;
    case 'del': deleteDialog(b.dataset.id); break;
    case 'parse': {
      const t = document.getElementById('imp-text').value;
      S.importText = t;
      const p = parseDialog(t);
      if (!p.segs.length){ S.parsed = null; S.parseErr = '没有识别到编号段落。每段需要以“1.”“2.”这样的数字开头。'; }
      else { S.parsed = p; S.parseErr = ''; }
      render(); break;
    }
    case 'save-import': saveImport(false); break;
    case 'save-new': saveImport(true); break;
    case 'jump': goTo(Number(b.dataset.i)); break;
    case 'filter': {
      S.filter = b.dataset.f; S.finish = false;
      if (d && S.filter === 'weak'){ const wl = weakList(d); if (wl.length && wl.indexOf(S.idx) < 0) S.idx = wl[0]; }
      resetSeg(); render(); break;
    }
    case 'play': if (d){ const s = d.segs[S.idx]; if (!(speaking && b.dataset.active === '1')){ S.plays++; const pl = app.querySelector('.plays'); if (pl) pl.textContent = `已播放 ${S.plays} 次`; } speak(s.text, s.lang, b); } break;
    case 'play-brief': if (d) speak(d.briefing, 'en', b); break;
    case 'show-src': S.showSrc = true; render(); break;
    case 'hint': S.hint = Math.min(4, S.hint + 1); render(); break;
    case 'reveal': S.hint = 4; render(); break;
    case 'hide-ans': S.hint = 0; render(); break;
    case 'rate': rate(Number(b.dataset.l)); break;
    case 'prev': step(-1); break;
    case 'next': step(1); break;
    case 'stamp': stampDone(); break;
    case 'undo-stamp': undoStamp(); break;
    case 'restart': if (d){ S.filter = 'all'; openDialog(S.cur, {fromStart:true}); } break;
    case 'restart-weak': if (d){ openDialog(S.cur, {fromStart:true, filter:'weak'}); } break;
    case 'export': exportBackup(); break;
    case 'test-zh': speak('你好，感谢您百忙之中抽空见我。', 'zh', b); break;
    case 'test-en': speak('Hello, that’s totally fine. What can I do for you?', 'en', b); break;
  }
});
app.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'imp-text') S.importText = t.value;
  if (t.dataset && t.dataset.pref === 'rate'){ prefs.rate = Number(t.value); savePrefs(); const rv = document.getElementById('rate-val'); if (rv) rv.textContent = prefs.rate.toFixed(1); }
});
app.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'backup-file'){ importBackup(t.files && t.files[0]); t.value = ''; return; }
  const k = t.dataset && t.dataset.pref; if (!k) return;
  if (t.type === 'checkbox') prefs[k] = t.checked;
  else if (k !== 'rate') prefs[k] = t.value;
  savePrefs();
  if (k === 'hideSource') S.showSrc = !prefs.hideSource;
});
document.addEventListener('keydown', e => {
  if (S.view !== 'study' || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  const k = e.key;
  if (k === 'ArrowRight'){ e.preventDefault(); step(1); }
  else if (k === 'ArrowLeft'){ e.preventDefault(); step(-1); }
  else if (S.finish) return;
  else if (k === ' '){ e.preventDefault(); const b = document.getElementById('playbtn'); if (b) b.click(); }
  else if (k === 'h' || k === 'H'){ S.hint = Math.min(4, S.hint + 1); render(); }
  else if (k === 'a' || k === 'A'){ S.hint = 4; render(); }
  else if (/^[1-4]$/.test(k)){ rate(Number(k)); }
});

init();
})();
</script>
</body>
</html>
